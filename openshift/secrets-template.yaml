# Do NOT commit real values.
# Apply with real keys:
#   oc create secret generic setu-rag-secrets \
#     --from-literal=GROQ_API_KEY=<key> \
#     --from-literal=JINA_API_KEY=<key> \
#     -n setu-rag
#
#   oc create secret generic setu-rag-github-webhook \
#     --from-literal=WebHookSecretKey=<random-string> \
#     -n setu-rag
apiVersion: v1
kind: Secret
metadata:
  name: setu-rag-secrets
  namespace: setu-rag
type: Opaque
stringData:
  GROQ_API_KEY: "REPLACE_ME"
  JINA_API_KEY: "REPLACE_ME"

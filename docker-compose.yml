services:
  app:
    build: .
    image: setu-compliance-rag:latest
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      LLM_PROVIDER: groq
      LLM_MODEL: llama-3.1-8b
      EMBEDDINGS_PROVIDER: jina
      EMBEDDINGS_MODEL: jina-embeddings-v2-base-en
    volumes:
      - chroma_data:/app/chroma_db
      - ./dataset:/app/dataset:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  chroma_data:
    driver: local

# Do NOT commit real values — replace placeholders and apply with:
#   kubectl apply -f k8s/secrets-template.yaml
# Or create from CLI (recommended):
#   kubectl create secret generic setu-rag-secrets \
#     --from-literal=GROQ_API_KEY=<your-key> \
#     --from-literal=JINA_API_KEY=<your-key> \
#     -n setu-rag
apiVersion: v1
kind: Secret
metadata:
  name: setu-rag-secrets
  namespace: setu-rag
type: Opaque
stringData:
  GROQ_API_KEY: "REPLACE_ME"
  JINA_API_KEY: "REPLACE_ME"
